# Pushing a version tag (e.g. v0.2.0) tests Frameback on every platform, builds
# it, and publishes the builds as a GitHub release, which the app's updater
# offers. The tag must match Cargo.toml's version.
name: Release

on:
  push:
    tags: ["v*"]

# Only publishing the release writes
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    strategy:
      # Build every platform even if one fails, to see all problems in one run
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            ext: zip
          - os: windows-2025
            platform: windows-x64
            ext: zip
          - os: ubuntu-24.04
            platform: linux-x64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ASSET: Frameback-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.ext }}
    steps:
      # Actions are pinned to their commits, as a tag can be moved to other code, which this job's secrets would reach
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ffmpeg
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's $version"; exit 1; }

      # macOS keeps the app's Camera permission across updates while each release is signed with the same
      # certificate. It's self-signed, made once with:
      #   openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 9125 -subj "/CN=Frameback" \
      #     -addext "keyUsage=critical,digitalSignature" -addext "extendedKeyUsage=critical,codeSigning"
      #   openssl pkcs12 -export -legacy -inkey key.pem -in cert.pem -out cert.p12
      # and kept base64 encoded in the MACOS_SIGNING_CERTIFICATE secret, with its password in MACOS_SIGNING_PASSWORD.
      # A new certificate costs everyone the permission once more.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" > /dev/null
          # codesign only finds identities in the keychains it searches
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # It's untrusted, being self-signed, which codesign doesn't mind
          identity=$(security find-identity -p codesigning "$keychain" | awk '$1 == "1)" { print $2; exit }')
          [ -n "$identity" ] || { echo "No signing identity in the certificate"; exit 1; }
          echo "FRAMEBACK_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh
          # ditto keeps the app's symlinks and signature
          ditto -c -k --keepParent dist/Frameback.app "$ASSET"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          Compress-Archive -Path dist/Frameback -DestinationPath "$env:ASSET"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/package-linux.sh
          tar -czf "$ASSET" -C dist Frameback

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # The app's updater checks downloads against these
      - name: Checksums
        run: sha256sum Frameback-* > SHA256SUMS

      # Tags with a suffix, e.g. v0.2.0-rc.1, are pre-releases, which the app doesn't offer as updates
      - name: Publish the release
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease Frameback-* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
